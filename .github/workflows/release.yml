name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flask waitress pyinstaller

      - name: Build exe
        run: |
          pyinstaller presence-planning.spec

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PresencePlanning.exe
          generate_release_notes: true
